name: Release

# Publishes a GitHub release when a release/v* branch is pushed (the tag is
# created at that commit). Notes come from the matching CHANGELOG section.
# Assets: one installer and one portable zip, x64 only —
# IsoFoundry-v<ver>-x64-Setup.exe, IsoFoundry-v<ver>-x64-Portable.zip,
# SHA256SUMS.txt.

on:
  push:
    branches: ['release/v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check branch matches Cargo version
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("release/v$ver" -ne "${{ github.ref_name }}") { throw "branch ${{ github.ref_name }} does not match Cargo version $ver" }
      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: Install packaging tools
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package
        shell: pwsh
        run: |
          pwsh -NoProfile -File packaging/package.ps1 -Target x86_64-pc-windows-msvc -Arch x64 -OutDir dist -Installers
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assets-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#release/}"
          ver="${v#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {on=1; print; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          pre=()
          case "$v" in v0.*) pre+=(--prerelease);; esac
          gh release create "$v" --target "$GITHUB_SHA" --title "IsoFoundry $v" --notes-file notes.md "${pre[@]}" dist/*
