name: CI

# Builds, lints and tests on Windows with MSVC and a static CRT (D-030,
# D-043). x64 runs the tests; ARM64 is cross-built (no ARM64 runner tests).
# Each build packages the release assets (packaging/package.ps1), installs and
# uninstalls the x64 Setup.exe, and uploads everything for testing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            test: true
          - target: aarch64-pc-windows-msvc
            arch: arm64
            test: false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust target and tools
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add ${{ matrix.target }}
      - name: Format
        if: matrix.test
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Test
        if: matrix.test
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: CLI smoke test
        if: matrix.test
        shell: pwsh
        run: |
          # The console twin (shipped as isofoundry.com, D-048) is what scripts run.
          $exe = "target/${{ matrix.target }}/release/isofoundry-cli.exe"
          $v = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $v -notmatch '^IsoFoundry ') { throw "version failed: $v" }
          & $exe helper-check --json
          if ($LASTEXITCODE -ne 0) { throw "helper-check failed" }
          & $exe backup --json
          if ($LASTEXITCODE -ne 40) { throw "expected exit 40 (not_implemented), got $LASTEXITCODE" }
          # Mount: an ISO directly and a CHD through a temporary ISO (D-005).
          $fx = "crates/if-image/tests/fixtures"
          foreach ($img in @("$fx/plain.iso", "$fx/plain_cd.chd")) {
            $r = & $exe mount $img --json | ConvertFrom-Json
            if (-not $r.ok) { throw "mount $img failed" }
            $root = ($r.result -replace '^Mounted at (\S+).*$', '$1')
            Write-Host "mounted $img at $root"
            if (-not (Test-Path (Join-Path $root 'README.TXT'))) { throw "README.TXT not visible on $root" }
            & $exe unmount $img
            if ($LASTEXITCODE -ne 0) { throw "unmount $img failed" }
          }
          exit 0  # the expected exit 40 above would otherwise fail the step
      - name: Static CRT check
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          foreach ($f in 'isofoundry.exe', 'isofoundry-cli.exe', 'isofoundry-helper.exe', 'isofoundry-portable.exe') {
            $deps = & $dumpbin /dependents "target/${{ matrix.target }}/release/$f" | Out-String
            if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "$f links the dynamic CRT:`n$deps" }
          }
      - name: Install packaging tools
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package
        shell: pwsh
        run: |
          $extra = @{}
          if ('${{ matrix.arch }}' -eq 'x64') { $extra.Installers = $true }
          pwsh -NoProfile -File packaging/package.ps1 -Target ${{ matrix.target }} -Arch ${{ matrix.arch }} -OutDir dist @extra
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
      - name: Install and uninstall test
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-Setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/TASKS=addtopath', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup.exe exit $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\IsoFoundry"
          $v = & "$dir\isofoundry.com" --version
          if ($v -notmatch '^IsoFoundry ') { throw "installed per-user build did not run: $v" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0 -or (Test-Path "$dir\isofoundry.exe")) { throw "uninstall failed" }
          Write-Host "Setup.exe install, run and uninstall OK"
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IsoFoundry-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 14
